[package]
name = "lepton_rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

# Keep this crate out of the parent workspace - it needs special build flags
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
lepton_jpeg = { path = "../lib", features = ["use_rayon"] }
wasm-bindgen = "0.2"
wasm-bindgen-rayon = { version = "1.2", features = ["no-bundler"] }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
